<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="description" content="Becoming — small steps, big changes. Your personal wellness and faith tracker.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Becoming</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow" id="today-label">YOUR DAY</p>
        <h1>Becoming<span class="period">.</span></h1>
      </div>
      <button class="icon-button" id="install-button" hidden aria-label="Install app">＋</button>
    </header>

    <main id="view" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-item active" data-page="home"><span>⌂</span><small>Today</small></button>
      <button class="nav-item" data-page="habits"><span>◉</span><small>Habits</small></button>
      <button class="nav-item" data-page="fitness"><span>↗</span><small>Fitness</small></button>
      <button class="nav-item" data-page="health"><span>＋</span><small>Health</small></button>
      <button class="nav-item" data-page="more"><span>•••</span><small>More</small></button>
    </nav>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="./app.js"></script>
</body>
</html>
